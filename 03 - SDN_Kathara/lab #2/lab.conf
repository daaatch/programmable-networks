# topology refactoring: 
# + controller implementation
# + switches implementation
# - routers removal
# + dedicated management network
# docker images required for controller and switches
LAB_NAME="lab #2"
LAB_DESCRIPTION="three hosts connected through OVS switches managed by SDN controller"

# switches permissions
s1[privileged]="true"
s2[privileged]="true"
s3[privileged]="true"

# docker images setup
s1[image]="kathara/sdn"
s2[image]="kathara/sdn"
s3[image]="kathara/sdn"
controller[image]="kathara/pox"

# LAN configuration
h1[0]="lan1"
s1[0]="lan1"
h2[0]="lan2"
s2[0]="lan2"
h3[0]="lan3"
s3[0]="lan3"

# inter-switch links
s1[1]="link12"
s2[1]="link12"
s1[2]="link13"
s3[1]="link13"

# control plane network
controller[0]="mgmt"
s1[3]="mgmt"
s2[2]="mgmt"
s3[2]="mgmt"

# difference between lab#1 and lab#2:
# - decoupling between control plane and data plane
# - control logic removed from individual network devices
# + centralized controller node implementation
# + dedicated management network implementation
# - control traffic isolated from data plane traffic
